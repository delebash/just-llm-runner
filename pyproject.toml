# SPDX-License-Identifier: MIT
[project]
name = "llm-runner"
version = "0.1.0"
description = "Shared local-LLM runner core for JustVoice + JustWrite — detects hardware, manages/recommends GGUF models, downloads the right prebuilt llama.cpp (CUDA bundled), and spawns llama-server (OpenAI-compatible). Internal library; not published to PyPI."
requires-python = ">=3.10"
license = { text = "MIT" }
# Deliberately light deps — still NO ML (torch/transformers), so the JustWrite
# sidecar bundle stays small. The three vendor SDKs below (the 2026-07-17 SDK pivot)
# add ~15-25 MB installed (google-genai pulls google-auth + websockets) — no ML;
# accepted by the ruling.
dependencies = [
    "fastapi>=0.115",   # the mountable router (both apps mount it)
    "pydantic>=2.9",    # camelCase schema (shared contract)
    "requests>=2.32",   # HF Hub JSON API + THE file downloader (chunk-queue, runner/download.py)
    "httpx>=0.27",      # provider adapters (cloud + local chat-completions)
    # ADDED 2026-08-01 after a clean-venv audit. `llm/db.py` and `platform/data_api.py`
    # import SQLAlchemy, and `install_llm` — the headline "one call" entry point — takes an
    # engine + session_factory, so this is a REAL dependency of the documented path, never
    # optional. It was missing for the repo's whole life and nothing caught it: JustWrite and
    # JustVoice each declare `sqlalchemy>=2.0` themselves, so the import always resolved by
    # coincidence of the HOST's dependency list, and the suite runs on JustWrite's venv
    # (CLAUDE.md) where it is present. Measured in a venv holding only the deps above:
    # `llm_runner.llm` and `llm_runner.platform` both died with ModuleNotFoundError, taking
    # 11,773 of the package's 19,720 lines with them. `scripts/check-clean-install.py` is the
    # tripwire that now fails if this regresses.
    "sqlalchemy>=2.0",  # llm/db.py tables + platform/data_api.py reflection; install_llm's contract
    # Official vendor SDKs (user ruling 2026-07-17 — the SDK pivot; versions are the
    # live-proof pins): they own each cloud's wire format + retries. Local adapters
    # (llama.cpp/Ollama/generic compat) deliberately stay on httpx.
    "openai>=2.46",
    "anthropic>=0.117",
    "google-genai>=2.12",
]

[project.optional-dependencies]
# Only needed to run the core STANDALONE as its own server (JustWrite's
# sidecar). When mounted into JustVoice's existing server, uvicorn is
# already present there.
serve = ["uvicorn>=0.32"]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["llm_runner*"]

# NOTE: there is no `package-data` block. It used to ship `llm_runner/runner/runner-manifest.json`,
# a file deleted with A7 (config is data, it belongs in the DB — see runner/config.py). The entry
# outlived the file by months and only survives in the stale `build/` tree. If you re-add package
# data, confirm the file exists on disk first.

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    # The real-router integration smoke (2026-07-22 pass-1 plan T8): runs the REAL
    # installed engine + router + one small on-disk model. Env-gated — every test
    # self-skips unless JW_REALROUTER=1 and JUSTWRITE_DATA_DIR point at a data root
    # with an engine + the smoke model. Run: python -m pytest -m realrouter -n 0 -v
    "realrouter: real-engine/router integration smoke (env-gated, never in default runs)",
]

[tool.ruff]
line-length = 100
target-version = "py310"
